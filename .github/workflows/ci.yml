name: ci

on:
  workflow_dispatch: {}
  pull_request:
    branches: [goblins]
  push: { branches: [goblins] }

jobs:
  changed:
    name: Detect source changes
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.detect.outputs.source }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Detect source paths
        id: detect
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/detect-source-change.sh ci

  build-test:
    needs: changed
    if: ${{ needs.changed.outputs.source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RUST_MIN_STACK: "8388608" # 8 MiB — upstream sets this for personality tests that overflow the default 2 MiB tokio worker stack
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0

      - name: Restore Cargo cache
        id: cache_cargo_restore
        continue-on-error: true
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/debug/
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcap-dev \
            pkg-config

      - name: Build Rust CLI
        working-directory: codex-rs
        run: cargo build -p codex-cli --bin codex

      - name: Test prompt personality path
        working-directory: codex-rs
        run: "cargo test -p codex-core personality::"

      - name: Save Cargo cache
        if: always() && !cancelled() && steps.cache_cargo_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/debug/
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GOBLINS_VERSION="$(node -p "require('./codex-cli/package.json').version")"
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./codex-cli/scripts/build_npm_package.py \
            --release-version "$GOBLINS_VERSION" \
            --package @brasalabs/goblins \
            --staging-dir "${RUNNER_TEMP}/goblins-npm-stage" \
            --pack-output "${OUTPUT_DIR}/goblins-npm-${GOBLINS_VERSION}.tgz"
          PACK_OUTPUT="${OUTPUT_DIR}/goblins-npm-${GOBLINS_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: goblins-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format
